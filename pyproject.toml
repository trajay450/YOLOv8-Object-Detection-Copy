[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-yolov8-demo"
version = "0.1.0"
description = "YOLOv8 object detection tutorial on a reproducible synthetic shapes dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "opencv-python>=4.7", "PyYAML>=6.0"]

[project.optional-dependencies]
train = ["ultralytics>=8.0,<9"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
